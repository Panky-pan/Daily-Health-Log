<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Health Log</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background-color: #F7F2E4;
    color: #2F3B2F;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* 漂浮的彩色小装饰 */
  .dot { position: absolute; border-radius: 50%; opacity: 0.85; }
  .dot1 { width: 14px; height: 14px; background: #5BA85F; top: 12%; left: 14%; }
  .dot2 { width: 10px; height: 10px; background: #F2C14E; top: 22%; right: 18%; }
  .dot3 { width: 12px; height: 12px; background: #E88BB1; bottom: 18%; left: 20%; }
  .dot4 { width: 9px;  height: 9px;  background: #6FB3D2; bottom: 26%; right: 14%; }
  .star { position: absolute; font-size: 18px; color: #5BA85F; opacity: 0.7; }
  .star1 { top: 16%; left: 26%; }
  .star2 { top: 60%; right: 22%; }

  @media (prefers-reduced-motion: no-preference) {
    .dot1 { animation: float 4s ease-in-out infinite; }
    .dot2 { animation: float 5s ease-in-out 0.6s infinite; }
    .dot3 { animation: float 4.5s ease-in-out 1.2s infinite; }
    .dot4 { animation: float 5.5s ease-in-out 0.3s infinite; }
    .star1 { animation: twinkle 3s ease-in-out infinite; }
    .star2 { animation: twinkle 3.6s ease-in-out 1s infinite; }
    .blob  { animation: bounce 3.2s ease-in-out infinite; }
    .arm   { animation: wave 2.2s ease-in-out infinite; transform-origin: 75% 20%; }
    .bubble-text { animation: pop 3.2s ease-in-out infinite; }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-14px); }
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.25; transform: scale(0.9); }
    50%      { opacity: 0.8;  transform: scale(1.1); }
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-10px) rotate(-2deg); }
  }
  @keyframes wave {
    0%, 100% { transform: rotate(0deg); }
    25%      { transform: rotate(18deg); }
    60%      { transform: rotate(-8deg); }
  }
  @keyframes pop {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.04); }
  }

  .card {
    text-align: center;
    padding: 48px 40px;
    max-width: 520px;
  }

  h1 {
    font-size: 44px;
    line-height: 1.25;
    font-weight: 800;
    letter-spacing: 0.5px;
  }
  h1 .green { color: #4C9A5F; }

  .underline {
    display: block;
    margin: 6px auto 0;
  }

  .bubble {
    display: inline-block;
    background: #FDFBF3;
    border: 2px solid #2F3B2F;
    border-radius: 16px;
    padding: 10px 18px;
    font-size: 15px;
    font-style: italic;
    margin-top: 28px;
    box-shadow: 3px 3px 0 #2F3B2F;
  }

  .blob-area { margin-top: 20px; }
  .blob { display: inline-block; }

  .tip {
    margin-top: 30px;
    font-size: 14px;
    color: #7A8471;
  }
</style>
</head>
<body>

  <span class="dot dot1"></span>
  <span class="dot dot2"></span>
  <span class="dot dot3"></span>
  <span class="dot dot4"></span>
  <span class="star star1">✦</span>
  <span class="star star2">✦</span>

  <main class="card">
    <h1>
      每天记录，<br>
      <span class="green">健康多一点</span>
      <svg class="underline" width="120" height="10" viewBox="0 0 120 10">
        <path d="M2 6 Q 20 1, 40 6 T 78 6 T 118 5" fill="none" stroke="#4C9A5F" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </h1>

    <div class="bubble bubble-text">IT'S MORE FUN TOGETHER!</div>

    <div class="blob-area">
      <svg class="blob" width="150" height="140" viewBox="0 0 150 140" aria-label="挥手的小绿团">
        <!-- 身体：圆润的绿色团子 -->
        <path d="M75 18 C 108 18, 128 42, 126 72 C 124 104, 102 122, 74 122 C 46 122, 26 102, 26 70 C 26 40, 46 18, 75 18 Z" fill="#5BA85F"/>
        <!-- 高光 -->
        <ellipse cx="52" cy="44" rx="14" ry="9" fill="#7BBE7E" opacity="0.6" transform="rotate(-24 52 44)"/>
        <!-- 眼睛 -->
        <circle cx="60" cy="66" r="4.5" fill="#2F3B2F"/>
        <circle cx="92" cy="66" r="4.5" fill="#2F3B2F"/>
        <!-- 微笑 -->
        <path d="M64 82 Q 76 92, 88 82" fill="none" stroke="#2F3B2F" stroke-width="3" stroke-linecap="round"/>
        <!-- 腮红 -->
        <ellipse cx="48" cy="78" rx="6" ry="4" fill="#E88BB1" opacity="0.7"/>
        <ellipse cx="104" cy="78" rx="6" ry="4" fill="#E88BB1" opacity="0.7"/>
        <!-- 挥手的短手臂 -->
        <path class="arm" d="M122 58 Q 136 46, 140 34" fill="none" stroke="#2F3B2F" stroke-width="4" stroke-linecap="round"/>
        <!-- 小脚 -->
        <ellipse cx="62" cy="126" rx="10" ry="5" fill="#4C9A5F"/>
        <ellipse cx="90" cy="126" rx="10" ry="5" fill="#4C9A5F"/>
      </svg>
    </div>

    <p class="tip">占位页 · 网站功能将在 Day 7 上线</p>
  </main>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>记录今天 · Daily-Health-Log</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="container">

  <!-- 打卡页顶栏：只留「返回今日」，不挂四项导航。
       这一页是「从今日页进来、记完就回去」的一次性流程，多一层导航反而绕。 -->
  <header class="site-header page-header">
    <a class="page-back" href="index.html">← 返回今日</a>
    <div class="site-title">记录今天</div>
  </header>

  <main>
    <!-- 直接打开 checkin.html 又没设过目标时的兜底（PRD F1：没目标不让打卡） -->
    <section class="card" id="no-goal-card" hidden>
      <h2 class="card-title">还没设目标</h2>
      <p class="card-hint">定下每天的运动和饮水目标，打卡才有参照。回去设一下吧。</p>
      <a class="btn" href="index.html">回去设目标</a>
    </section>

    <!-- 打卡表单（PRD F2）：内容与 index 上原来的打卡卡片完全一致，
         当天已有记录时回填，方便修改后再存 -->
    <section class="card" id="checkin-card" hidden>
      <h2 class="card-title">今天记一笔</h2>
      <p class="card-hint" id="checkin-goal-hint"></p>

      <form id="checkin-form" novalidate>
        <!-- 运动：类型 + 时长，卡路里由 calories.js 自动估算 -->
        <div class="form-row">
          <label for="exercise-type">今天运动了吗</label>
          <div class="inline-row">
            <select id="exercise-type">
              <option value="">没运动 / 不记</option>
              <option value="散步">散步</option>
              <option value="慢跑">慢跑</option>
              <option value="跳绳">跳绳</option>
              <option value="骑行">骑行</option>
              <option value="力量训练">力量训练</option>
              <option value="瑜伽">瑜伽</option>
            </select>
            <input type="number" id="exercise-minutes" min="0" max="600" step="1" placeholder="多少分钟">
          </div>
          <p class="field-error" id="exercise-error" hidden></p>
        </div>

        <!-- 三餐：一句话 + 标签（健康/普通/放纵，只打标签不算热量；分值见 PRD 6.4） -->
        <div class="form-row">
          <label for="breakfast-text">早餐吃了什么</label>
          <input type="text" id="breakfast-text" maxlength="100" placeholder="一句话，比如：鸡蛋 + 牛奶">
          <div class="tag-group" data-meal="breakfast">
            <button type="button" class="tag" data-tag="健康">🥗 健康</button>
            <button type="button" class="tag" data-tag="普通">🍚 普通</button>
            <button type="button" class="tag" data-tag="放纵">🍔 放纵</button>
          </div>
          <p class="field-error" id="breakfast-error" hidden></p>
        </div>

        <div class="form-row">
          <label for="lunch-text">午餐吃了什么</label>
          <input type="text" id="lunch-text" maxlength="100" placeholder="一句话记录">
          <div class="tag-group" data-meal="lunch">
            <button type="button" class="tag" data-tag="健康">🥗 健康</button>
            <button type="button" class="tag" data-tag="普通">🍚 普通</button>
            <button type="button" class="tag" data-tag="放纵">🍔 放纵</button>
          </div>
          <p class="field-error" id="lunch-error" hidden></p>
        </div>

        <div class="form-row">
          <label for="dinner-text">晚餐吃了什么</label>
          <input type="text" id="dinner-text" maxlength="100" placeholder="一句话记录">
          <div class="tag-group" data-meal="dinner">
            <button type="button" class="tag" data-tag="健康">🥗 健康</button>
            <button type="button" class="tag" data-tag="普通">🍚 普通</button>
            <button type="button" class="tag" data-tag="放纵">🍔 放纵</button>
          </div>
          <p class="field-error" id="dinner-error" hidden></p>
        </div>

        <!-- 体重 + 饮水 -->
        <div class="form-row">
          <label for="weight-kg">今天体重（kg）</label>
          <input type="number" id="weight-kg" min="30" max="200" step="0.1" placeholder="比如 65.5">
          <p class="field-error" id="weight-error" hidden></p>
        </div>

        <div class="form-row">
          <label for="water-ml">今天喝了多少水（ml）</label>
          <input type="number" id="water-ml" min="0" max="10000" step="1" placeholder="比如 1800">
          <p class="field-error" id="water-error" hidden></p>
        </div>

        <p class="field-error" id="checkin-save-error" hidden></p>
        <button type="submit" class="btn" id="checkin-submit">保存今日打卡</button>
      </form>

      <!-- 保存后的状态与卡路里结果 -->
      <p class="checkin-status" id="checkin-status" hidden></p>
      <p class="calorie-note" id="calorie-note" hidden></p>
    </section>
  </main>

  <footer class="page-footer">数据只存在你自己的浏览器里，放心用。</footer>

</div>

<script src="assets/js/storage.js"></script>
<script src="assets/js/calories.js"></script>
<script src="assets/js/validate.js"></script>
<script src="assets/js/checkin.js"></script>

</body>
</html>

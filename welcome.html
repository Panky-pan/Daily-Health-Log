<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首页 · Daily-Health-Log</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- 开屏页：上下两段式布局
     上段（奶油底）：品牌名 + 插画，插画下缘压过色块交界线；
     下段（淡绿色块）：标题 + 副标题 + 主按钮 + 小字，页脚贴底。
     Day 11：主按钮从 <a> 换成 <button>，由 welcome.js 管理状态机
     （空闲 → 处理中 → 成功跳转 / 失败提示），点击有泡泡戳破动画 -->
<div class="splash">

  <div class="splash-top">
    <header class="splash-brand">每日健康打卡</header>
    <img class="splash-figure" src="assets/img/splash-health.png"
         alt="身体健康插画：绿色笔画的举臂小人">
  </div>

  <main class="splash-band">
    <h1 class="splash-title">身体是<span class="accent">革命的本钱</span></h1>
    <p class="hero-sub">每天花一分钟，记下运动、饮食、体重和喝水。坚持这件事，让它自己看得见。</p>
    <p class="hero-error" id="enter-error" hidden>暂时无法记录数据，请刷新</p>
    <button class="btn btn-hero" id="enter-btn" type="button">开启我的健康记录</button>
    <p class="hero-note">不用注册、不用登录，记完就存在你自己的浏览器里。</p>

    <footer class="page-footer">数据只存在你自己的浏览器里，放心用。</footer>
  </main>

</div>

<script src="assets/js/welcome.js"></script>
</body>
</html>

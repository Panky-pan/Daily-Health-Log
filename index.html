<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日打卡 · Daily-Health-Log</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="container">

  <!-- 顶部导航：三页共用结构，当前页链接加 class="active" -->
  <header class="site-header">
    <div class="site-title">每日健康打卡</div>
    <nav class="site-nav">
      <a href="index.html" class="active">今日打卡</a>
      <a href="history.html">历史记录</a>
      <a href="trends.html">趋势</a>
    </nav>
  </header>

  <main>
    <!-- 目标设置表单：首次打开（没存过设置）时显示，PRD F1 -->
    <section class="card" id="settings-card" hidden>
      <h2 class="card-title">先设个小目标</h2>
      <p class="card-hint">第一次来？定下每天的运动和饮水目标，之后随时能改。</p>
      <form id="settings-form" novalidate>
        <div class="form-row">
          <label for="goal-exercise">每天运动多少分钟</label>
          <input type="number" id="goal-exercise" min="1" max="600" step="1" placeholder="比如 30" required>
          <p class="field-error" id="goal-exercise-error" hidden></p>
        </div>
        <div class="form-row">
          <label for="goal-water">每天喝多少水（ml）</label>
          <input type="number" id="goal-water" min="1" max="10000" step="1" placeholder="比如 2000" required>
          <p class="field-error" id="goal-water-error" hidden></p>
        </div>
        <p class="field-error" id="settings-save-error" hidden></p>
        <button type="submit" class="btn">保存目标</button>
      </form>
    </section>

    <!-- 已设目标展示：保存后显示，点「改目标」可重新编辑 -->
    <section class="card" id="goal-card" hidden>
      <h2 class="card-title">今日目标</h2>
      <p id="goal-text" class="goal-text"></p>
      <button type="button" class="btn btn-ghost" id="btn-change-goal">改目标</button>
    </section>

    <!-- streak 大字区（第 4 步）：连续打卡天数 + 历史最长 -->
    <section class="card streak-card" id="streak-card">
      <div class="streak-item">
        <span class="streak-num" id="streak-current">0</span>
        <span class="streak-label">连续打卡（天）</span>
      </div>
      <div class="streak-item">
        <span class="streak-num" id="streak-longest">0</span>
        <span class="streak-label">历史最长（天）</span>
      </div>
    </section>

    <!-- 目标提醒条（PRD F5）：未打卡/未达标 → 黄色写差值；达标 → 绿色 -->
    <p class="reminder" id="reminder-bar" hidden></p>

    <!-- 打卡表单（PRD F2）：设好目标后显示；当天已有记录时回填内容
         第 5 步去 history.html 搭日历，本页不再加新块 -->
    <section class="card" id="checkin-card">
      <h2 class="card-title">今日打卡</h2>

      <form id="checkin-form" novalidate>
        <!-- 运动：类型 + 时长，卡路里由 calories.js 自动估算 -->
        <div class="form-row">
          <label for="exercise-type">今天运动了吗</label>
          <div class="inline-row">
            <select id="exercise-type">
              <option value="">没运动 / 不记</option>
              <option value="散步">散步</option>
              <option value="慢跑">慢跑</option>
              <option value="跳绳">跳绳</option>
              <option value="骑行">骑行</option>
              <option value="力量训练">力量训练</option>
              <option value="瑜伽">瑜伽</option>
            </select>
            <input type="number" id="exercise-minutes" min="0" max="600" step="1" placeholder="多少分钟">
          </div>
          <p class="field-error" id="exercise-error" hidden></p>
        </div>

        <!-- 三餐：一句话 + 标签（清爽/标准/丰盛，只打标签不算热量） -->
        <div class="form-row">
          <label for="breakfast-text">早餐吃了什么</label>
          <input type="text" id="breakfast-text" maxlength="100" placeholder="一句话，比如：鸡蛋 + 牛奶">
          <div class="tag-group" data-meal="breakfast">
            <button type="button" class="tag" data-tag="清爽">清爽</button>
            <button type="button" class="tag" data-tag="标准">标准</button>
            <button type="button" class="tag" data-tag="丰盛">丰盛</button>
          </div>
          <p class="field-error" id="breakfast-error" hidden></p>
        </div>

        <div class="form-row">
          <label for="lunch-text">午餐吃了什么</label>
          <input type="text" id="lunch-text" maxlength="100" placeholder="一句话记录">
          <div class="tag-group" data-meal="lunch">
            <button type="button" class="tag" data-tag="清爽">清爽</button>
            <button type="button" class="tag" data-tag="标准">标准</button>
            <button type="button" class="tag" data-tag="丰盛">丰盛</button>
          </div>
          <p class="field-error" id="lunch-error" hidden></p>
        </div>

        <div class="form-row">
          <label for="dinner-text">晚餐吃了什么</label>
          <input type="text" id="dinner-text" maxlength="100" placeholder="一句话记录">
          <div class="tag-group" data-meal="dinner">
            <button type="button" class="tag" data-tag="清爽">清爽</button>
            <button type="button" class="tag" data-tag="标准">标准</button>
            <button type="button" class="tag" data-tag="丰盛">丰盛</button>
          </div>
          <p class="field-error" id="dinner-error" hidden></p>
        </div>

        <!-- 体重 + 饮水 -->
        <div class="form-row">
          <label for="weight-kg">今天体重（kg）</label>
          <input type="number" id="weight-kg" min="30" max="200" step="0.1" placeholder="比如 65.5">
          <p class="field-error" id="weight-error" hidden></p>
        </div>

        <div class="form-row">
          <label for="water-ml">今天喝了多少水（ml）</label>
          <input type="number" id="water-ml" min="0" max="10000" step="1" placeholder="比如 1800">
          <p class="field-error" id="water-error" hidden></p>
        </div>

        <p class="field-error" id="checkin-save-error" hidden></p>
        <button type="submit" class="btn">保存今日打卡</button>
      </form>

      <!-- 保存后的状态与卡路里结果 -->
      <p class="checkin-status" id="checkin-status" hidden></p>
      <p class="calorie-note" id="calorie-note" hidden></p>
    </section>
  </main>

  <footer class="page-footer">数据只存在你自己的浏览器里，放心用。</footer>

</div>

<script src="assets/js/storage.js"></script>
<script src="assets/js/calories.js"></script>
<script src="assets/js/validate.js"></script>
<script src="assets/js/stats.js"></script>
<script src="assets/js/today.js"></script>

</body>
</html>

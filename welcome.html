<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首页 · Daily-Health-Log</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="container container-splash">

  <!-- 开屏页只放品牌名，不放导航：点「开启我的健康记录」进入应用后，
       各页面自带导航栏，照样能去今日打卡 / 历史记录 / 趋势，也能回这里 -->
  <header class="splash-brand">每日健康打卡</header>

  <main>
    <!-- ============ hero 区：标题 + 插画 + 主按钮，整组垂直居中 ============ -->
    <section class="hero splash-hero">
      <h1 class="hero-title">身体是革命的本钱</h1>
      <img class="splash-figure" src="assets/img/splash-health.png"
           alt="身体健康插画：绿色笔画的举臂小人">
      <p class="hero-sub">每天花一分钟，记下运动、饮食、体重和喝水。坚持这件事，让它自己看得见。</p>
      <a class="btn btn-hero" href="index.html">开启我的健康记录</a>
      <p class="hero-note">不用注册、不用登录，记完就存在你自己的浏览器里。</p>
    </section>
  </main>

  <footer class="page-footer">数据只存在你自己的浏览器里，放心用。</footer>

</div>

</body>
</html>
